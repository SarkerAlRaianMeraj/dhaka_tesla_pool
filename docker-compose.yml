# Dhaka Tesla Pool — frontend, API, and database.
# Usage: cp .env.example .env, fill in real values, then docker compose up --build
# Host ports are published so the apps are reachable from a browser on the host.

name: dhaka-tesla-pool

# Both backend services run the exact same image, so it is built once and tagged.
# migrate and api can therefore never drift apart.
x-backend: &backend
  build:
    context: ./backend
  image: dhaka-tesla-pool-api:latest

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_HOST: ${DATABASE_HOST:-db}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_USER: ${DATABASE_USER:-postgres}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
  DATABASE_NAME: ${POSTGRES_DB:-dhaka_tesla_pool}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (copy .env.example)}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
  SEED_DEMO_SCENARIO: ${SEED_DEMO_SCENARIO:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema migration. Kept as its own service so that starting several
  # API replicas can never run migrations concurrently, and so a migration
  # failure stops the stack instead of being logged and ignored.
  migrate:
    <<: *backend
    environment: *backend-env
    command: ["node", "dist/database/migrate.js", "run"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-http://localhost:3000/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: